name: Build c-OS ISO

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PREFIX: ${{ github.workspace }}/toolchain
  TARGET: i686-elf
  PATH: ${{ github.workspace }}/toolchain/bin:${{ github.workspace }}/toolchain/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo libgmp-dev libmpc-dev libmpfr-dev \
            grub-pc-bin grub-common xorriso make

      - name: Build i686-elf cross compiler
        run: |
          set -eux
          mkdir -p "$PREFIX" "$RUNNER_TEMP/src"
          cd "$RUNNER_TEMP/src"
          curl -L --fail --retry 3 https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz -o binutils.tar.xz
          curl -L --fail --retry 3 https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz -o gcc.tar.xz
          tar -xf binutils.tar.xz
          tar -xf gcc.tar.xz
          mkdir binutils-build gcc-build
          cd binutils-build
          ../binutils-2.44/configure --target="$TARGET" --prefix="$PREFIX" --with-sysroot --disable-nls --disable-werror
          make -j"$(nproc)"
          make install
          cd ../gcc-build
          ../gcc-14.2.0/configure --target="$TARGET" --prefix="$PREFIX" --disable-nls --enable-languages=c --without-headers
          make all-gcc -j"$(nproc)"
          make all-target-libgcc -j"$(nproc)"
          make install-gcc
          make install-target-libgcc

      - name: Verify cross compiler
        run: |
          i686-elf-as --version
          i686-elf-gcc --version
          i686-elf-ld --version

      - name: Build c-OS kernel
        run: make kernel

      - name: Build bootable ISO
        run: make iso

      - name: Upload c-OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: c-OS-iso
          path: build/c-OS.iso
          if-no-files-found: error
