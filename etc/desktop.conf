# c-OS native desktop configuration
# Inspired by lightweight BSD/X11 desktop setups.
# This is a native c-OS desktop, not an OpenBSD binary package.

[desktop]
enabled=1
mode=framebuffer
width=640
height=480
bpp=32

[window_manager]
name=cwm-lite
style=tiling
keyboard_driven=1

[shortcuts]
terminal=T
redraw=R

[apps]
terminal=terminal
files=files
settings=settings
packages=pkg

# OpenBSD's cwm is a lightweight X11 window manager. c-OS uses its own
# implementation here because OpenBSD binaries are not native c-OS programs.
