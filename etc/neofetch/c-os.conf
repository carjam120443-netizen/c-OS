# c-OS Neofetch configuration
# Neofetch itself is available as an OpenBSD port (sysutils/neofetch),
# but OpenBSD binaries are not directly executable on c-OS.
# This config is reserved for the native c-OS port.

ascii_distro="c-os"

# c-OS logo: original Tux-inspired ASCII art for this project.
ascii='  .--.  
 |o_o | 
 |:_/ | 
//   \\ \\ 
(|     | )
/\\_   _/\\
\\___)=(___/'

# Keep the output useful on the early c-OS terminal.
print_info() {
    info title
    info "OS" "c-OS"
    info "Kernel" "c-OS"
    info "Architecture" "i686"
    info "Shell" "c-OS shell"
    info "Package manager" "pkg"
}
